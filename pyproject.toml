[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "article2mp4"
version = "0.1.0"
description = "Turn a Markdown article into a narrated explainer video (9:16 and 16:9) with Manim animations and an offline Chinese TTS voice."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "6eanut" }]
keywords = ["video", "manim", "tts", "text-to-video", "explainer", "kokoro"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "manim==0.22.0",
    "kokoro-onnx==0.4.7",
    "misaki[zh]==0.7.4",
    "onnxruntime==1.31.0",
    "soundfile",
    "numpy",
    "openai",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
article2mp4 = "video_agent.cli:main"

[project.urls]
Homepage = "https://github.com/6eanut/article2mp4"
Repository = "https://github.com/6eanut/article2mp4"

[tool.setuptools]
packages = ["video_agent", "video_agent.templates"]

[tool.setuptools.package-data]
video_agent = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".env-mamba", "output", "media", "articles"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
